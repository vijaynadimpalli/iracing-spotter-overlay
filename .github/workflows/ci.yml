name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check compiler
        shell: pwsh
        run: g++ --version

      - name: Build and test
        shell: pwsh
        run: ./build_and_test.ps1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: spotter_overlay
          path: spotter_overlay.exe
